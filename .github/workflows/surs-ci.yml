name: Lampa plugin JavaScript checks
on:
  push:
    branches:
      - main
      - feat/surs-v3.8.0
    paths:
      - surs.js
      - surs-editor.js
      - build/surs.source.txt
      - scripts/build-surs.cjs
      - scripts/hot-discovery.cjs
      - scripts/kp-demand-history.cjs
      - scripts/hot-ranking-4-7.cjs
      - scripts/hot-source-budget.cjs
      - scripts/hot-feed-integrity.cjs
      - .github/workflows/hot-discovery.yml
      - home_categories.js
      - kp_rating_pro.js
      - num_series.js
      - num_series_v1_3_0.js
      - tests/**
      - .github/workflows/surs-ci.yml
  pull_request:
    paths:
      - surs.js
      - surs-editor.js
      - build/surs.source.txt
      - scripts/build-surs.cjs
      - scripts/hot-discovery.cjs
      - scripts/kp-demand-history.cjs
      - scripts/hot-ranking-4-7.cjs
      - scripts/hot-source-budget.cjs
      - scripts/hot-feed-integrity.cjs
      - .github/workflows/hot-discovery.yml
      - home_categories.js
      - kp_rating_pro.js
      - num_series.js
      - num_series_v1_3_0.js
      - tests/**
      - .github/workflows/surs-ci.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/hot-discovery.cjs
      - run: node --check scripts/kp-demand-history.cjs
      - run: node --check scripts/hot-ranking-4-7.cjs
      - run: node --check scripts/hot-source-budget.cjs
      - run: node --check scripts/hot-feed-integrity.cjs
      - run: node --test tests/hot-discovery.test.cjs tests/kp-demand-history.test.cjs tests/hot-ranking-4-7.test.cjs tests/hot-source-budget.test.cjs tests/hot-source-evidence.test.cjs tests/hot-kp-pacing.test.cjs tests/hot-feed-integrity.test.cjs
      - run: node scripts/build-surs.cjs --check
      - run: node --check surs-editor.js
      - run: node --check surs.js
      - run: node --check home_categories.js
      - run: node --check kp_rating_pro.js
      - run: node tests/kp-rating-pro-smoke.cjs
      - run: node --check num_series.js
      - run: node tests/home-categories-performance.cjs
      - run: node --check tests/num-series-smoke.cjs
      - run: node --check tests/surs-smoke.cjs
      - run: node tests/surs-smoke.cjs
      - run: node tests/num-series-smoke.cjs
      - name: Real Hot 4.11 dry-run and current top-40 comparison (no publish)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/hot-discovery-')
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          KINOPOISK_API_KEY: ${{ secrets.KINOPOISK_API_KEY }}
          MDBLIST_LIST_IDS: ${{ vars.MDBLIST_LIST_IDS }}
        run: |
          set -euo pipefail
          if [[ -z "$TMDB_READ_ACCESS_TOKEN" && -z "$TMDB_API_KEY" ]]; then
            echo "::error::TMDB credential is required for the real prepublish dry run."
            exit 1
          fi
          cp data/hot-discovery.json "${RUNNER_TEMP}/hot-discovery-before.json"
          node scripts/hot-discovery.cjs > "${RUNNER_TEMP}/hot-discovery-run.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+
            '/hot-discovery-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('data/hot-discovery.json','utf8'));
          if(after.algorithm!=='hot-discovery-4.11')throw Error('New 4.6 feed was not generated locally');
          const c=after.diagnostics.comparison;
          if(!c||c.previous_count!==before.items.length||
            c.new_count!==after.items.length)throw Error('Comparison is incomplete');
          const models=after.diagnostics.model_comparison;
          if(!models||!models.models||!models.models.baseline||
            !models.models.demand||!models.models.fresh)
            throw Error('Missing same-candidate model comparison');
          const sum=after.diagnostics.second_pass_details;
          console.log('SECOND_PASS:',JSON.stringify({
            details:sum,verified:after.diagnostics.second_pass_verified,
            selected:after.diagnostics.second_pass_selected}));
          console.log('MODEL_COMPARISON:',JSON.stringify(models));
          const evidenceChecks=after.diagnostics.rating_evidence;
          if(!evidenceChecks||evidenceChecks.selected!==after.items.length||
            evidenceChecks.high+evidenceChecks.medium+
              evidenceChecks.limited!==after.items.length)
            throw Error('Rating evidence coverage diagnostics invalid');
          const sourceMismatch=after.items.some(x=>
            !x.surs_hot_rating_evidence||
            x.surs_hot_rating_evidence.source_count<1||
            x.surs_hot_rating_evidence.source_count>3);
          if(sourceMismatch)throw Error('Missing per-card provenance');
          console.log('RATING_EVIDENCE:',JSON.stringify(evidenceChecks));
          console.log('DYNAMIC_PROVENANCE:',JSON.stringify({
            missing_current_tmdb_popularity:
              after.diagnostics.tmdb_cached_popularity_unobserved,
            missing_current_tmdb_votes:
              after.diagnostics.tmdb_cached_vote_count_unobserved}));
          const pace=after.diagnostics;
          if(pace.kp_pacing_slot==null||pace.kp_pacing_ceiling==null||
            pace.kp_pacing_run_allowance==null||
            pace.kp_calls>pace.kp_pacing_run_allowance||
            pace.kp_daily_used>pace.kp_pacing_ceiling)
            throw Error('KP paced UTC quota gate violated');
          console.log('KP_PACING:',JSON.stringify({
            slot:pace.kp_pacing_slot,ceiling:pace.kp_pacing_ceiling,
            allowance:pace.kp_pacing_run_allowance,used:pace.kp_daily_used,
            calls:pace.kp_calls,cache_preview:pace.kp_preview_ranked_from_cache,
            direct_id_matches:pace.kp_known_id_refresh_matches,
            deferred:pace.kp_rating_budget_deferred
          }));
          const integrity=after.diagnostics.feed_integrity;
          if(!integrity?.validated||!integrity.strict||
            !integrity.source_health?.healthy||
            integrity.source_health.healthy_lanes!==4)
            throw Error('4.11 TMDB first-page source-integrity gate failed');
          console.log('FEED_INTEGRITY:',JSON.stringify(integrity));
          const evidence=after.diagnostics.external_demand;
          console.log('BEFORE:',before.algorithm,before.items.length,'items');
          console.log('AFTER:',after.algorithm,after.items.length,'items');
          console.log('TOP40_COMPARISON:',JSON.stringify(c));
          console.log('KP_EVIDENCE:',JSON.stringify(evidence));
          console.log('TOP10:',JSON.stringify(after.diagnostics.top10));
          const key=x=>x.type+':'+x.id;
          const oldIds=new Set(before.items.map(key));
          const newIds=new Set(after.items.map(key));
          console.log('NEW_CARDS:',JSON.stringify(after.items.filter(x=>
            !oldIds.has(key(x))).map(x=>({rank:x.surs_hot_rank,
            title:x.title,age:x.surs_hot_rank_age,score:x.surs_hot_score}))));
          console.log('REMOVED_CARDS:',JSON.stringify(before.items.filter(x=>
            !newIds.has(key(x))).map(x=>({rank:x.surs_hot_rank,
            title:x.title,age:x.surs_hot_rank_age}))));
          console.log('TOP20_CARDS:',JSON.stringify(after.items.slice(0,20).map(x=>({
            rank:x.surs_hot_rank,title:x.title,kind:x.surs_hot_premiere_kind,
            score:x.surs_hot_score,age:x.surs_hot_rank_age,
            trend_day:x.surs_hot_trend_day,trend_week:x.surs_hot_trend_week,
            kp_rank:x.surs_hot_kinopoisk_popularity_rank,
            growth_status:x.surs_hot_growth_status
          }))));
          if(after.items.some(x=>Math.abs(x.surs_hot_score-
            Math.round(x.surs_hot_base_score*100)/100)>.011))
            throw Error('Published scores must never be altered by curation');
          if(after.items.some(x=>x.surs_hot_attention_sources>2))
            throw Error('TMDB day/week may not count as separate providers');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Hot 4.11 real dry-run (no publishing)\n'+
            'Before: '+before.algorithm+' ('+before.items.length+')\n'+
            'After: '+after.algorithm+' ('+after.items.length+')\n'+
            'Top-40 retained: '+c.retained+', added: '+c.added+
            ', removed: '+c.removed+', top-10 retained: '+c.top10_retained+
            '\nKP rank movement samples: '+evidence.momentum_rank_measured+
            ', vote-growth samples: '+evidence.momentum_votes_measured+
            ', positive KP momentum: '+evidence.momentum_positive+'\n');
          NODE
          # Counterfactual: rank the EXACT 4.7 selected cards using the 4.6
          # scoring engine from main. This isolates ranking changes, but not
          # the discovery/eligibility effects of the two engines.
          git fetch --depth=2 origin main
          git show origin/main:scripts/hot-discovery.cjs > scripts/hot-discovery-v48-shadow.cjs
          node - <<'NODE'
          const old=require('./scripts/hot-discovery-v48-shadow.cjs');
          const fs=require('node:fs');
          const after=JSON.parse(fs.readFileSync('data/hot-discovery.json','utf8'));
          const previous=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+
            '/hot-discovery-before.json','utf8'));
          const history=JSON.parse(fs.readFileSync('data/hot-discovery-history.json','utf8'));
          const input=structuredClone(after.items);
          const oldRows=old.scoreCandidates(input,history,
            new Date(after.generated_at),previous);
          const id=x=>x.type+':'+x.id;
          const oldTop=oldRows.slice(0,10).map(id);
          const newTop=after.items.slice(0,10).map(id);
          const overlap=newTop.filter(x=>oldTop.includes(x)).length;
          console.log('SAME_CANDIDATES_48_VS_49:',JSON.stringify({
            sample_size:input.length,old_selected:oldRows.length,
            old_top10:oldTop,new_top10:newTop,top10_overlap:overlap,
            caveat:'Same 4.7-selected cards; does not measure old-only candidates or real viewer clicks'
          }));
          NODE
          # Verify repeat run reuses verified TMDB metadata and stays under KP caps.
          node scripts/hot-discovery.cjs > "${RUNNER_TEMP}/hot-discovery-repeat.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const first=JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP+'/hot-discovery-run.json','utf8'));
          const again=JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP+'/hot-discovery-repeat.json','utf8'));
          const a=first.diagnostics,b=again.diagnostics;
          if(!b.tmdb_detail_cache_hits||b.tmdb_calls>=a.tmdb_calls)
            throw Error('TMDB cache did not reduce repeated API calls');
          if(b.kp_daily_used>210||b.kp_calls>45||
            b.kp_daily_used>b.kp_pacing_ceiling)
            throw Error('Kinopoisk API budget exceeded');
          console.log('REPEAT_CACHE:',JSON.stringify({
            before_tmdb_calls:a.tmdb_calls,repeat_tmdb_calls:b.tmdb_calls,
            cache_hits:b.tmdb_detail_cache_hits,
            season_cache_hits:b.tmdb_season_cache_hits,
            kp_daily_used:b.kp_daily_used,
            kp_daily_remaining:b.kp_daily_remaining,
            kp_run_calls:b.kp_calls}));
          NODE
          git diff --stat -- data/hot-discovery.json data/hot-discovery-history.json data/hot-discovery-audit.json data/hot-discovery-kp-cache.json data/hot-discovery-tmdb-cache.json

