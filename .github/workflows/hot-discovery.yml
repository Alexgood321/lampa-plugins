name: SURS Hot Discovery builder

on:
  push:
    branches: [main]
    paths:
      - scripts/hot-discovery.cjs
      - scripts/kp-demand-history.cjs
      - scripts/hot-ranking-4-7.cjs
      - scripts/hot-source-budget.cjs
      - scripts/hot-feed-integrity.cjs
      - scripts/hot-evidence-gate.cjs
      - .github/workflows/hot-discovery.yml
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surs-hot-discovery-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Rerunning an old workflow attempt must reuse the newest KP cache.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate builder offline
        run: |
          node --check scripts/hot-discovery.cjs
          node --check scripts/kp-demand-history.cjs
          node --check scripts/hot-ranking-4-7.cjs
          node --check scripts/hot-source-budget.cjs
          node --check scripts/hot-feed-integrity.cjs
          node --check scripts/hot-evidence-gate.cjs
          node --test tests/hot-discovery.test.cjs tests/kp-demand-history.test.cjs tests/hot-ranking-4-7.test.cjs tests/hot-source-budget.test.cjs tests/hot-source-evidence.test.cjs tests/hot-kp-pacing.test.cjs tests/hot-feed-integrity.test.cjs tests/hot-evidence-gate.test.cjs
      - name: Fetch and rank
        id: compute
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          KINOPOISK_API_KEY: ${{ secrets.KINOPOISK_API_KEY }}
          MDBLIST_LIST_IDS: ${{ vars.MDBLIST_LIST_IDS }}
        run: |
          set -euo pipefail
          if [[ -z "$TMDB_READ_ACCESS_TOKEN" && -z "$TMDB_API_KEY" ]]; then
            echo "::error title=TMDB credentials missing::Configure TMDB_READ_ACCESS_TOKEN or TMDB_API_KEY in repository Actions secrets."
            echo "## Hot Discovery not configured: no feed was generated" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/hot-discovery.cjs
          echo "status=generated" >> "$GITHUB_OUTPUT"
      - name: Publish only validated data
        if: steps.compute.outputs.status == 'generated'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=(data/hot-discovery.json data/hot-discovery-history.json data/hot-discovery-audit.json data/hot-discovery-kp-cache.json data/hot-discovery-tmdb-cache.json)
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          changed=()
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            if ! git ls-files --error-unmatch "$file" >/dev/null 2>&1 || ! git diff --quiet -- "$file"; then
              cp "$file" "$temp/$(basename "$file")"
              changed+=("$file")
            fi
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changes to publish" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Never resolve conflicts by force-pushing or rebasing generated JSON.
          # Re-apply only new generated files on the latest main in each attempt.
          pushed=0
          for attempt in 1 2 3; do
            git fetch --depth=25 origin main
            git reset --hard origin/main
            current_date="$(node -e "try{console.log(require('./data/hot-discovery-audit.json').generated_at)}catch(e){console.log('')}")"
            new_date="$(node -p "require('$temp/hot-discovery-audit.json').generated_at")"
            if [[ -n "$current_date" && "$current_date" > "$new_date" ]]; then
              echo "A newer Hot Discovery audit was published; keeping remote data." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            for file in "${changed[@]}"; do
              cp "$temp/$(basename "$file")" "$file"
            done
            node -e "const fs=require('fs');for(const p of process.argv.slice(1))JSON.parse(fs.readFileSync(p,'utf8'))" "${changed[@]}"
            git add -- "${changed[@]}"
            if git diff --cached --quiet; then
              pushed=1
              break
            fi
            git commit -m 'data(hot): update verified ranking, snapshots and KP cache [skip ci]'
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
          done
          if [[ "$pushed" != 1 ]]; then
            echo "::error::Unable to publish audited feed without overwriting upstream work."
            exit 1
          fi
          echo "Updated Hot Discovery; previous good feed preserved in Git history." >> "$GITHUB_STEP_SUMMARY"
          node -e "const a=require('./data/hot-discovery-audit.json');console.log('Candidates evaluated:',a.candidate_total,'Eligible:',a.eligible,'Selected:',a.selected)" >> "$GITHUB_STEP_SUMMARY"
